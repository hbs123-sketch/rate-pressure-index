<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rate Pressure Index | Data-Center Growth and Electric Bills</title>
    <meta name="description" content="Explore sourced public filings and bill changes shaping data-center-related rate pressure for pilot electric utilities.">
    <meta property="og:title" content="Rate Pressure Index | Data-Center Growth and Electric Bills">
    <meta property="og:description" content="Explore sourced public filings and bill changes shaping data-center-related rate pressure for pilot electric utilities.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://rate-pressure-index.vercel.app/">
    <meta name="twitter:card" content="summary">
    <link rel="canonical" href="https://rate-pressure-index.vercel.app/">
    <script type="application/ld+json" id="rate-pressure-index-dataset">
      {
        "@context": "https://schema.org",
        "@type": "Dataset",
        "name": "Rate Pressure Index",
        "description": "A public-data indicator that combines five cited factors to describe rate pressure associated with data-center-related grid buildout. It is not a causal determination.",
        "url": "https://rate-pressure-index.vercel.app/",
        "isAccessibleForFree": true,
        "variableMeasured": [
          "Grid constraint score",
          "Tariff protection score",
          "Buildout scale score",
          "Rate case score",
          "Rate trend score"
        ],
        "distribution": {
          "@type": "DataDownload",
          "contentUrl": "https://rate-pressure-index.vercel.app/data/utilities.json",
          "encodingFormat": "application/json"
        }
      }
    </script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="lookup-panel" aria-labelledby="page-title">
        <div>
          <h1 id="page-title">Could data-center growth be putting pressure on your electric bill?</h1>
          <p class="lede">
            Utilities are expanding the grid for large new loads. Enter your ZIP to see the public filings and bill changes shaping local rate pressure.
          </p>
          <div class="network-motif" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        </div>
        <form id="lookup-form" class="lookup-form" novalidate>
          <label for="zip">ZIP code</label>
          <div class="input-row">
            <input id="zip" name="zip" inputmode="numeric" autocomplete="postal-code" pattern="[0-9]{5}" placeholder="20147" required>
            <button type="submit">Check</button>
          </div>
          <p id="form-error" class="form-error" role="alert"></p>
          <p class="trust-line">Every number sourced and linked. Not affiliated with any utility.</p>
        </form>
        <div id="pilot-preview" class="pilot-preview" aria-label="Live pilot utility scores"></div>
      </section>

      <section id="result" class="result-panel" hidden></section>
      <section id="not-covered" class="result-panel muted-panel" aria-live="polite" hidden></section>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
