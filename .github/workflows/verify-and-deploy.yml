name: Verify and deploy

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: npx playwright install --with-deps chromium
      - run: python scripts/fetch-eia-baseline.py
      - run: npm test
      - run: python scripts/verify-eia-baseline.py
      - run: npm run test:source
      - name: Run browser audit
        shell: bash
        run: |
          python3 -m http.server 4173 --directory . >/tmp/rpi-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/rpi-server.log' EXIT
          npm run test:browser

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: team_4oFXAX3SUtj2v53UxZvAZIw6
      VERCEL_PROJECT_ID: prj_jomYsJsbcQv5Av3hf9Ir2C7pOu5Y
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --global vercel@50.14.1
      - run: vercel pull --yes --environment=production
      - run: vercel build --prod
      - run: vercel deploy --prebuilt --prod
